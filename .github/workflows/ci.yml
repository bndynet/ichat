name: CI

on:
  push:
    branches: [main, v3]
  pull_request:
    branches: [main, v3]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Build + Test
        run: npm run pretest && npm test

  coverage:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build + Coverage (chat-messages)
        run: npm run test:coverage -w @bndynet/ichat-messages 2>&1 | node tools/check-coverage.mjs

      - name: Build + Coverage (chat-input)
        run: npm run test:coverage -w @bndynet/ichat-input 2>&1 | node tools/check-coverage.mjs
